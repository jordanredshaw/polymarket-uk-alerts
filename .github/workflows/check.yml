name: Check for new UK politics markets

# The real 5-minute cadence comes from cron-job.org POSTing to this
# workflow's /dispatches API endpoint — GitHub throttles `schedule` crons to
# every 1-3h in practice (observed Aug 2026), but dispatched runs fire
# immediately. The schedule below is only a fallback if the external
# trigger dies.
on:
  schedule:
    - cron: "17 * * * *" # fallback only — see note above
  workflow_dispatch:

concurrency:
  group: check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Poll Polymarket and alert
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_KEY: ${{ secrets.CALLMEBOT_KEY }}
        run: python src/check.py

      - name: Poll UEFA newsroom and alert
        if: ${{ !cancelled() }} # run even if the Polymarket step failed
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_KEY: ${{ secrets.CALLMEBOT_KEY }}
        run: python src/uefa_news.py

      - name: Commit updated state
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "Update seen events"
            git push
          fi
